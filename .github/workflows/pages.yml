name: Publicar GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Decodificar binarios (PDF/XLSX)
        run: |
          for f in $(find _bin -name '*.b64'); do out="${f#_bin/}"; out="${out%.b64}"; mkdir -p "$(dirname "$out")"; base64 -d "$f" > "$out"; done
          mkdir -p memoria_tecnica && mv memoria/*.pdf memoria_tecnica/ && rmdir memoria
          rm -rf _bin .github
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        uses: actions/deploy-pages@v4
